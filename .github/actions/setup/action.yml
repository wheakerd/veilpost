name: Set up project tools
description: Select the repository-pinned Node, Bun and Go toolchains.
runs:
    using: composite
    steps:
        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version-file: app/frontend/.nvmrc
        - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
          with:
              bun-version-file: app/frontend/package.json
        - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
          with:
              go-version-file: app/backend/.go-version
              cache-dependency-path: app/backend/go.sum
