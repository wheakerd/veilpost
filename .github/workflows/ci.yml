name: CI

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: checks-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    GOTOOLCHAIN: local
    GOTELEMETRY: 'off'
    GOCACHE: ${{ github.workspace }}/.runtime/go-build
    GOMODCACHE: ${{ github.workspace }}/.runtime/go-mod
    TEST_WORKERS: '4'
    OPEN_BROWSER: 'false'

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Install locked dependencies
              run: make install
            - name: Install browser and system dependencies
              working-directory: app/frontend
              run: bunx playwright install --with-deps chromium
            - name: Validate workflow syntax and expressions
              run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
            - name: Run all checks and tests
              run: make check
            - name: Build production artifacts
              run: make build
            - name: Retain browser failure diagnostics
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: browser-diagnostics
                  path: app/frontend/test-results/
                  retention-days: 7
                  if-no-files-found: ignore

    containers:
        needs: check
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            VPN_COMPOSE_PROJECT: veilpost-ci
            FRONTEND_PORT: '0'
            OPEN_BROWSER: 'false'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Validate and start isolated development containers
              run: |
                  docker compose config --quiet
                  make start
            - name: Verify real container authentication and persistence
              run: python3 scripts/compose-smoke.py
            - name: Container diagnostics
              if: failure()
              run: make logs
            - name: Remove only the disposable CI stack and its test data
              if: always()
              run: docker compose -p veilpost-ci down --volumes --remove-orphans
