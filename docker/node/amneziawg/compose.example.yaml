# Example only: the development Compose stack does not include this file.
# Copy it to the node, set the variables (for example in an .env file next to
# it), then run: docker compose -f compose.example.yaml up -d --build
name: amneziawg

services:
  amneziawg:
    build:
      context: .
    image: ${AWG_IMAGE:-veilpost-amneziawg:dev}
    container_name: amneziawg
    # Host networking: the container installs NAT and filter rules for the
    # host's uplink and listens on the host's UDP port.
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
      # SELinux hosts (Fedora, RHEL) may also need: label=disable
    read_only: true
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=32m,mode=1777
    volumes:
      - type: bind
        source: ${AWG_STATE_DIR:?set AWG_STATE_DIR to a root-owned 0700 directory on the node}
        target: /var/lib/amneziawg
    environment:
      AWG_ENDPOINT_HOST: ${AWG_ENDPOINT_HOST:?set AWG_ENDPOINT_HOST to the public address clients connect to}
      AWG_LISTEN_PORT: ${AWG_LISTEN_PORT:-443}
      AWG_INTERFACE: ${AWG_INTERFACE:-awg0}
      AWG_MTU: ${AWG_MTU:-1280}
      AWG_SERVER_IPV4: ${AWG_SERVER_IPV4:-10.77.0.1/24}
      AWG_CLIENT_IPV4: ${AWG_CLIENT_IPV4:-10.77.0.2/32}
      AWG_IPV4_SUBNET: ${AWG_IPV4_SUBNET:-10.77.0.0/24}
      AWG_SERVER_IPV6: ${AWG_SERVER_IPV6:-fd77:77:77::1/64}
      AWG_CLIENT_IPV6: ${AWG_CLIENT_IPV6:-fd77:77:77::2/128}
      AWG_IPV6_SUBNET: ${AWG_IPV6_SUBNET:-fd77:77:77::/64}
      AWG_CLIENT_NAME: ${AWG_CLIENT_NAME:-client1}
      AWG_CLIENT_DNS: ${AWG_CLIENT_DNS:-1.1.1.1, 2606:4700:4700::1111}
      AWG_CLIENT_I1: ${AWG_CLIENT_I1:-}
      AWG_CLIENT_I2: ${AWG_CLIENT_I2:-}
      AWG_CLIENT_I3: ${AWG_CLIENT_I3:-}
      AWG_CLIENT_I4: ${AWG_CLIENT_I4:-}
      AWG_CLIENT_I5: ${AWG_CLIENT_I5:-}
      AWG_REQUIRE_IPV6: ${AWG_REQUIRE_IPV6:-false}
      AWG_NATIVE_NFT_MODE: ${AWG_NATIVE_NFT_MODE:-auto}
      AWG_NATIVE_NFT_FAMILY: ${AWG_NATIVE_NFT_FAMILY:-inet}
      AWG_NATIVE_NFT_TABLE: ${AWG_NATIVE_NFT_TABLE:-filter}
      AWG_NATIVE_NFT_INPUT_CHAIN: ${AWG_NATIVE_NFT_INPUT_CHAIN:-input}
      AWG_NATIVE_NFT_FORWARD_CHAIN: ${AWG_NATIVE_NFT_FORWARD_CHAIN:-forward}
      LOG_LEVEL: ${AWG_LOG_LEVEL:-error}
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/usr/local/bin/awg-healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
