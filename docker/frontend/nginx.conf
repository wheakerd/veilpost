# Static production reference: Nginx must share a network with the backend service.
# Terminate HTTPS before this listener and configure VPN_PUBLIC_ORIGIN in production.
# Set VPN_TRUSTED_PROXIES to this Nginx address so login rate limits apply per client.
# Deploy dist/frontend/ to /usr/share/nginx/html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve the browser-facing Host for same-origin authentication checks.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Required for Vue Router createWebHistory() direct links and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
