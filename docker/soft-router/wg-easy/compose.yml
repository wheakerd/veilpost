services:
  wg-easy:
    image: ${WG_EASY_IMAGE:-ghcr.io/wg-easy/wg-easy:15.4.0}
    container_name: wg-easy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/wg-easy/nft-entrypoint.sh"]
    command: ["/usr/bin/dumb-init", "node", "server/index.mjs"]
    environment:
      PORT: "51821"
      HOST: "0.0.0.0"
      INSECURE: "false"
      DISABLE_VERSION_CHECK: "true"
      DEBUG: ""
    env_file:
      - path: /var/lib/wg-easy/bootstrap.env
        required: false
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    volumes:
      - /var/lib/wg-easy/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
      - ./nft-entrypoint.sh:/opt/wg-easy/nft-entrypoint.sh:ro
    ports:
      - "51820:51820/udp"
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wg show interfaces | grep -qx wg0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
    container_name: wg-easy-caddy
    restart: unless-stopped
    depends_on:
      - wg-easy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/wg-easy/caddy-data:/data
      - /var/lib/wg-easy/caddy-config:/config
    networks:
      wg:
        ipv4_address: 10.42.42.43
        ipv6_address: fdcc:ad94:bacf:61a3::2b
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  wg:
    name: wg-easy-net
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: br-wg-easy
    ipam:
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
