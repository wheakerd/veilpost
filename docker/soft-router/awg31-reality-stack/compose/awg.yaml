name: amneziawg31
services:
  gateway:
    image: ${AWG_IMAGE:?image identity required}
    pull_policy: never
    container_name: amneziawg31-gateway
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    volumes:
      - /var/lib/amneziawg-3.1:/var/lib/amneziawg
    env_file: ${AWG_ENV_FILE:-/var/lib/amneziawg-3.1/service.env}
    environment:
      AWG_REQUIRE_IPV6: "false"
      GOMEMLIMIT: 160MiB
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, /usr/local/bin/awg-healthcheck]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
    labels:
      org.soft-router.owner: awg31-reality-stack
